[project]
name = "ppo-perishable-pricing"
version = "0.1.0"
description = "PPO-based dynamic markdown optimization for perishable products."
readme = "README.md"
requires-python = "==3.13.9"
dependencies = [
    "numpy==2.3.5",
    "pandas==2.3.3",
    "scipy==1.16.3",
    "scikit-learn==1.7.2",
    "matplotlib==3.10.6",
    "pyarrow==21.0.0",
    "joblib==1.5.2",
    "gymnasium==1.3.0",
    "stable-baselines3==2.9.0",
    "torch==2.13.0",
    "pytest==8.4.2",
    "openpyxl==3.1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["src"]
